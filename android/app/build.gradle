plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.rokumirror'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.rokumirror'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so it installs without any extra setup.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
